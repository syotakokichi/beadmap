<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beadmap</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <span class="brand">beadmap</span>
  <span id="source" class="source" title="データソース"></span>
  <span id="freshness" class="freshness"></span>
</header>

<div id="stale-banner" class="stale-banner hidden"></div>

<main>
  <section id="tiles" class="tiles" aria-label="サマリー"></section>

  <section class="filters">
    <select id="f-priority"><option value="">priority: 全て</option></select>
    <select id="f-label"><option value="">ラベル: 全て</option></select>
    <input id="f-search" type="search" placeholder="ID・タイトルを検索">
    <button id="toggle-expand" class="chip" title="親子ツリーの展開切替">子を展開</button>
  </section>

  <section class="panes">
    <div id="list" class="pane list-pane" aria-label="一覧"></div>
    <div id="splitter" class="splitter" title="ドラッグで幅を調整"></div>
    <div id="detail" class="pane detail-pane" aria-label="詳細"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
